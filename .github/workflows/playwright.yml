
name: Playwright Test

on:
  # Keeps automated PR checks
  pull_request:
    branches: [ main, master ]

  # Enables manual on-demand execution with UI inputs
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Select Test Suite / Tag to Run'
        required: true
        default: '@smoke'
        type: choice
        options:
          - '@smoke'
          - '@regression'
          - '@smoke and @prod-safe'
          - 'All Tests'
      environment:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - 'staging'
          - 'prod'
          - 'qa'

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - run: npm ci

      # .env.* stays gitignored. Pass values here instead of committing config/.env.qa.
      - name: Run Playwright Tests
        env:
          CI: true
          ENV: ${{ github.event.inputs.environment || 'qa' }}
          TEST_SUITE: ${{ github.event.inputs.test_suite }}
          BASE_URL: https://practicetestautomation.com/practice-test-login/
          TEST_USER: ${{ secrets.QA_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
        run: |
          if [ -z "$TEST_SUITE" ] || [ "$TEST_SUITE" = "All Tests" ]; then
            echo "Executing all tests on ${ENV}"
            npx playwright test
          elif [ "$TEST_SUITE" = "@smoke and @prod-safe" ]; then
            echo "Executing @smoke and @prod-safe on ${ENV}"
            npx playwright test --grep "(?=.*@smoke)(?=.*@prod-safe)"
          else
            echo "Executing suite ${TEST_SUITE} on ${ENV}"
            npx playwright test --grep "$TEST_SUITE"
          fi

      - name: Upload Report Artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy-report:
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
